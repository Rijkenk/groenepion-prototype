<main style="flex: 1; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px">

<sc-if value="{{isAvond}}" hint-placeholder-val="{{ true }}">
<section style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; border: 1px solid #E1E5DF">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #1E6B43">Volgende spelavond</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Vrijdag 20 november</div>
<div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; color: #5B625D">
<a href="{{mapsDefault}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 4px; min-height: 32px; color: #1E6B43; font-weight: 600; text-decoration: underline"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>'t Aahoes, Albardastraat 20, Aadorp</a>
<span>· vanaf 20:00</span>
</div>
<button onClick="{{toggleMaps}}" style="align-self: flex-start; min-height: 32px; padding: 0; border: 0; background: transparent; color: #4A544D; font-size: 13px; text-decoration: underline">{{mapsToggleLabel}}</button>
<sc-if value="{{mapsOpen}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<a href="{{mapsGoogle}}" target="_blank" rel="noopener" style="min-height: 44px; border-radius: 10px; border: 1.5px solid #CBD2CC; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #1C211E; text-decoration: none">Google Maps</a>
<a href="{{mapsApple}}" target="_blank" rel="noopener" style="min-height: 44px; border-radius: 10px; border: 1.5px solid #CBD2CC; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #1C211E; text-decoration: none">Apple Kaarten</a>
<a href="{{mapsWaze}}" target="_blank" rel="noopener" style="min-height: 44px; border-radius: 10px; border: 1.5px solid #CBD2CC; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #1C211E; text-decoration: none">Waze</a>
</div>
<div style="font-size: 12px; color: #5B625D">Je keuze wordt onthouden in je profiel.</div>
</sc-if>
<div style="display: flex; gap: 8px; margin-top: 8px">
<div style="flex: 1; background: #EEF5F0; border-radius: 10px; padding: 8px 10px"><div style="font-size: 18px; font-weight: 700">{{goingCount}}</div><div style="font-size: 12px; color: #4A544D">spelers komen</div></div>
<div style="flex: 1; background: #EEF5F0; border-radius: 10px; padding: 8px 10px"><div style="font-size: 18px; font-weight: 700">{{freeSeats}}</div><div style="font-size: 12px; color: #4A544D">plekken vrij</div></div>
<div style="flex: 1; background: #FDF3E1; border-radius: 10px; padding: 8px 10px"><div style="font-size: 18px; font-weight: 700">6</div><div style="font-size: 12px; color: #6B4A12">in Koopgoot</div></div>
</div>
</section>

<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px">Tafels</h2>
<sc-if value="{{offerBtnShow}}" hint-placeholder-val="{{ true }}">
<button onClick="{{openOffer}}" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid #1E6B43; background: transparent; color: #1E6B43; font-weight: 600; font-size: 14px">+ Tafel aanbieden</button>
</sc-if>
</div>

<sc-if value="{{offerOpen}}" hint-placeholder-val="{{ false }}">
<section style="background: #FFFFFF; border-radius: 16px; padding: 16px; border: 2px solid #1E6B43; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h3 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px">Tafel aanbieden</h3>
<button onClick="{{closeOffer}}" aria-label="Sluiten" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #E6ECE7; color: #1C211E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="tafelspel" style="font-size: 14px; font-weight: 600">Welk spel?</label>
<input id="tafelspel" type="text" value="{{form.game}}" onChange="{{setGame}}" placeholder="Zoek een spel" style="min-height: 44px; border-radius: 10px; border: 1px solid #CBD2CC; padding: 0 12px; font-size: 15px; font-family: inherit">
<div style="font-size: 12px; color: #5B625D">Uit je BGG-collectie of de spellotheek van de club:</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{gameSuggestions}}" as="g" hint-placeholder-count="4">
<button onClick="{{g.pick}}" style="{{g.style}}">{{g.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 600">Aantal spelers (inclusief jij)</div>
<div style="display: flex; align-items: center; gap: 12px">
<button onClick="{{decMax}}" aria-label="Minder spelers" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #1E6B43; background: #FFFFFF; color: #1E6B43; font-size: 22px; font-weight: 600">−</button>
<div style="font-size: 22px; font-weight: 700; min-width: 28px; text-align: center">{{form.max}}</div>
<button onClick="{{incMax}}" aria-label="Meer spelers" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #1E6B43; background: #FFFFFF; color: #1E6B43; font-size: 22px; font-weight: 600">+</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 600">Plekken al bezet (bijv. vrienden die meespelen)</div>
